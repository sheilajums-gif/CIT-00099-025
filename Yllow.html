<!DOCTYPE html>
<html>
<head>
    <title>Patient Registration</title>

    <style>
        body{
            background-color: lavender;
        }

        h2{
            color: blue;
            text-align center;
            margin: 10px 28%;
        }

        form{
            color: maroon;
        }

        h1{
            color: red;
        }
    </style>
</head>

<body>

    <h2>Patient's Registration</h2>

    <h1>Welcome to Patient Registration</marquee>

    <form>
        Full Name: <input type="text"><br><br>

        Age:
        <select>
            <option>18</option>
            <option>19</option>
            <option>20</option>
        </select><br><br>

        Gender: <input type="text"><br><br>
        ID Number: <input type="text"><br><br>
        Patient ID: <input type="text"><br><br>
        Phone Number: <input type="text"><br><br>
        Disability: <input type="text"><br><br>
        Describe Disability: <input type="text"><br><br>
        Address: <input type="text"><br><br>

        Marital Status:
        <select>
            <option>Single</option>
            <option>Married</option>
            <option>Prefer not to say</option>
        </select><br><br>

        Next of Kin: <input type="text"><br><br>
        Weight: <input type="text">
    </form>

</body>
</html>
